
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking project files..."
          ls -la
          test -f build.gradle
          test -f AndroidManifest.xml
          test -f MainActivity.java
