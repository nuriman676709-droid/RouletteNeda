
name: Build Android APK
on: workflow_dispatch: push: branches: - main - master
permissions: contents: read
jobs: build: name: Build Android APK runs-on: ubuntu-latest
steps:
  - name: Checkout project
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract Android project
    run: |
      set -eux
      unzip -q RouletteNedaAndroid.zip -d extracted
      find extracted -name settings.gradle -print
      find extracted -name build.gradle -print

  - name: Find project folder
    run: |
      PROJECT_DIR="$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)"
      test -n "$PROJECT_DIR"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: RouletteNeda-APK
      path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14