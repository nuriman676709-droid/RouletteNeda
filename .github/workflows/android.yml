steps:
  - name: Checkout project
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract Android project if needed
    run: |
      set -eu
      if [ -f "RouletteNedaAndroid.zip" ]; then
        mkdir -p extracted
        unzip -oq RouletteNedaAndroid.zip -d extracted
      fi

  - name: Find project folder
    run: |
      set -eu
      PROJECT_DIR="$(find . -type f -name settings.gradle -not -path './.git/*' -not -path '*/.gradle/*' -print -quit | xargs -r dirname)"
      if [ -z "$PROJECT_DIR" ]; then
        PROJECT_DIR="$(find . -type f -name settings.gradle.kts -not -path './.git/*' -not -path '*/.gradle/*' -print -quit | xargs -r dirname)"
      fi
      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: settings.gradle or settings.gradle.kts not found."
        echo "Check that the Android project or RouletteNedaAndroid.zip is in the repository."
        find . -maxdepth 4 -type f | head -100
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Project folder: $PROJECT_DIR"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build debug APK
    run: |
      set -eu
      cd "$PROJECT_DIR"
      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
        ./gradlew --no-daemon assembleDebug
      else
        gradle --no-daemon assembleDebug
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: RouletteNeda-APK
      path: |
        **/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14