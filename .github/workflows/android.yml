
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          set -eu
          mkdir -p extracted
          if [ -f "RouletteNedaAndroid.zip" ]; then
            unzip -oq RouletteNedaAndroid.zip -d extracted
          fi

      - name: Find project folder
        run: |
          set -eu
          PROJECT_DIR="$(find . -type f -name settings.gradle -not -path './.git/*' -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find . -type f -name settings.gradle.kts -not -path './.git/*' -printf '%h\n' | head -n 1)"
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo "Upload RouletteNedaAndroid.zip to the repository root."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RouletteNeda-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
