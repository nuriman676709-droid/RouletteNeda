- name: Check project files
    run: |
      ls -la
      find . -maxdepth 3 -type f | head -100

  - name: Upload project files
    uses: actions/upload-artifact@v4
    with:
      name: RouletteNeda-project
      path: |
        *.html
        *.apk
        app/
        *.gradle
        AndroidManifest.xml
      if-no-files-found: warn